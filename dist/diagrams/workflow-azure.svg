<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Deterministic AI workflow — Azure</title><desc id="desc">Trigger → Model step → Code validation → Next fixed step → Review or finish. Suggested services appear below each block.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#60738b"/></marker></defs><rect width="1280" height="420" fill="white"/><rect x="12" y="48" width="1256" height="325" rx="5" fill="#fafbfd" stroke="#c5cfdd" stroke-dasharray="6 5"/><text x="30" y="28" font-size="12" fill="#25364c" text-anchor="start" font-weight="600"><tspan x="30" dy="0">AZURE / REFERENCE FLOW</tspan></text><text x="30" y="70" font-size="12" fill="#52647a" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Logical system scope — device, application, and cloud blocks may have different deployment boundaries.</tspan></text><path d="M254 161H273" stroke="#60738b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="30" y="103" width="224" height="116" rx="4" fill="#ecf4ff" stroke="#94a7be"/><text x="142" y="139" font-size="15" fill="#25364c" text-anchor="middle" font-weight="600"><tspan x="142" dy="0">Trigger</tspan></text><text x="142" y="201" font-size="10" fill="#25364c" text-anchor="middle" font-weight="400"><tspan x="142" dy="0">01 · EVENT</tspan></text><text x="36" y="256" font-size="14" fill="#174f9d" text-anchor="start" font-weight="600"><tspan x="36" dy="0">Azure Event Grid</tspan></text><text x="36" y="324" font-size="10" fill="#60738b" text-anchor="start" font-weight="400"><tspan x="36" dy="0">SERVICE OPTION</tspan></text><path d="M503 161H522" stroke="#60738b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="279" y="103" width="224" height="116" rx="4" fill="#ecf4ff" stroke="#94a7be"/><text x="391" y="139" font-size="15" fill="#25364c" text-anchor="middle" font-weight="600"><tspan x="391" dy="0">Model step</tspan></text><text x="391" y="201" font-size="10" fill="#25364c" text-anchor="middle" font-weight="400"><tspan x="391" dy="0">02 · PROCESS</tspan></text><text x="285" y="256" font-size="14" fill="#174f9d" text-anchor="start" font-weight="600"><tspan x="285" dy="0">Azure OpenAI</tspan></text><text x="285" y="324" font-size="10" fill="#60738b" text-anchor="start" font-weight="400"><tspan x="285" dy="0">SERVICE OPTION</tspan></text><path d="M752 161H771" stroke="#60738b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="528" y="103" width="224" height="116" rx="4" fill="#ecf4ff" stroke="#94a7be"/><text x="640" y="139" font-size="15" fill="#25364c" text-anchor="middle" font-weight="600"><tspan x="640" dy="0">Code validation</tspan></text><text x="640" y="201" font-size="10" fill="#25364c" text-anchor="middle" font-weight="400"><tspan x="640" dy="0">03 · PROCESS</tspan></text><text x="534" y="256" font-size="14" fill="#174f9d" text-anchor="start" font-weight="600"><tspan x="534" dy="0">Azure Functions</tspan></text><text x="534" y="324" font-size="10" fill="#60738b" text-anchor="start" font-weight="400"><tspan x="534" dy="0">SERVICE OPTION</tspan></text><path d="M1001 161H1020" stroke="#60738b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="777" y="103" width="224" height="116" rx="4" fill="#ecf4ff" stroke="#94a7be"/><text x="889" y="139" font-size="15" fill="#25364c" text-anchor="middle" font-weight="600"><tspan x="889" dy="0">Next fixed step</tspan></text><text x="889" y="201" font-size="10" fill="#25364c" text-anchor="middle" font-weight="400"><tspan x="889" dy="0">04 · PROCESS</tspan></text><text x="783" y="256" font-size="14" fill="#174f9d" text-anchor="start" font-weight="600"><tspan x="783" dy="0">Azure Durable Functions</tspan></text><text x="783" y="324" font-size="10" fill="#60738b" text-anchor="start" font-weight="400"><tspan x="783" dy="0">SERVICE OPTION</tspan></text><rect x="1026" y="103" width="224" height="116" rx="28" fill="#edf2fa" stroke="#94a7be"/><text x="1138" y="139" font-size="15" fill="#25364c" text-anchor="middle" font-weight="600"><tspan x="1138" dy="0">Review or finish</tspan></text><text x="1138" y="201" font-size="10" fill="#25364c" text-anchor="middle" font-weight="400"><tspan x="1138" dy="0">05 · ACTOR</tspan></text><text x="1032" y="256" font-size="14" fill="#174f9d" text-anchor="start" font-weight="600"><tspan x="1032" dy="0">Human + review interface</tspan></text><text x="1032" y="324" font-size="10" fill="#60738b" text-anchor="start" font-weight="400"><tspan x="1032" dy="0">LOCAL / CUSTOM</tspan></text><text x="30" y="398" font-size="12" fill="#25364c" text-anchor="start" font-weight="400"><tspan x="30" dy="0">Solid arrows = primary data / execution path. Blocks show responsibilities, not necessarily separate deployments.</tspan></text></svg>